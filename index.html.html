<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pagos">
<title>Pagos de honorarios</title>
<link rel="apple-touch-icon" id="icon" href="data:,">
<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#111;--mute:#6b7280;--line:#e5e7eb;--accent:#2563eb;--ok:#16a34a;--warn:#ea580c;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#9ca3af;--line:#2c2c2e;--accent:#60a5fa;--ok:#4ade80;--warn:#fb923c;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#9ca3af;--line:#2c2c2e;--accent:#60a5fa;--ok:#4ade80;--warn:#fb923c;--bad:#f87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:640px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0}
header h1{flex:1;margin:0;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{margin:0 0 4px}
header .btn{padding:8px 10px}
.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;background:var(--card);color:var(--accent);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dng{color:var(--bad)}.btn:disabled{opacity:.4}
.full{display:block;width:100%;margin-top:8px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.job{display:flex;gap:12px;width:100%;text-align:left;border:0;color:inherit;font:inherit;cursor:pointer}
.bar{width:5px;border-radius:3px;background:var(--c);flex:none}
.grow{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
small{color:var(--mute)}
.amt{text-align:right;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.badge{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
.blue{--c:var(--accent)}.ok{--c:var(--ok)}.warn{--c:var(--warn)}.bad{--c:var(--bad)}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;margin:10px 0}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:7px;border-radius:8px;font:inherit}
.seg .on{background:var(--card);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border:0}.b{font-weight:700}.neg{color:var(--bad)}.pos{color:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.pan{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}.chk input{width:auto}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.msg{color:var(--mute);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<script>
const RATE=0.1525,TERM=30,SOON=7,KEY="pagos:v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0});
const clp=n=>nf.format(n);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const fmt=s=>parse(s).toLocaleDateString("es-CL",{day:"numeric",month:"short",year:"numeric"});
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=v=>parseInt(String(v).replace(/\D/g,""),10)||0;
const dots=v=>{const n=money(v);return n?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"."):""};

/* Finanzas y plazos (retención BH 2026 = 15,25 %; la jornada por contrato no retiene) */
const OT=0.15;
const otAmt=j=>Math.round(j.net*OT*(j.ot||0));
const net=j=>j.net+otAmt(j);
const gross=j=>j.kind==="boleta"?Math.round(net(j)/(1-RATE)):net(j);
const ret=j=>gross(j)-net(j);
const exp=j=>(j.expenses||[]).reduce((s,e)=>s+e.amount,0);
const dueStr=j=>{const s=(j.kind==="boleta"&&j.base==="inv"&&j.inv)?j.inv:j.prod;const d=parse(s);d.setDate(d.getDate()+TERM);return ymd(d)};
const left=j=>Math.round((parse(dueStr(j))-today())/864e5);
const urg=j=>j.paid?"ok":left(j)<0?"bad":left(j)<=SOON?"warn":"blue";
const days=n=>n===1?"1 día":n+" días";
const label=j=>{if(j.paid)return "Pagado";const d=left(j);return d<0?"Vencido hace "+days(-d):d===0?"Vence hoy":"Vence en "+days(d)};
const kindName=j=>j.kind==="boleta"?"Boleta de Honorarios":"Contrato por Jornada";

/* Almacenamiento local del navegador */
let jobs=[],memOnly=false;
const mig=j=>{if(j.net==null){const g=j.gross||0;j.net=g-(j.kind==="boleta"?Math.round(g*RATE):0)}return j};
try{jobs=JSON.parse(localStorage.getItem(KEY)||"[]").map(mig)}catch(e){memOnly=true}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(jobs))}catch(e){memOnly=true}};
let S={view:"home",id:null,filter:"all",asc:true,sheet:null,cd:false};

function home(){
  const pend=jobs.filter(j=>!j.paid),tot=pend.reduce((s,j)=>s+net(j),0),od=jobs.filter(j=>urg(j)==="bad").length;
  const list=jobs.filter(j=>S.filter==="all"||(S.filter==="p"?!j.paid:j.paid)).sort((a,b)=>(a.prod<b.prod?-1:a.prod>b.prod?1:0)*(S.asc?1:-1));
  const seg=[["all","Todos"],["p","Pendientes"],["d","Pagados"]].map(x=>`<button class="${S.filter===x[0]?"on":""}" data-act="filter" data-v="${x[0]}">${x[1]}</button>`).join("");
  return `<header><h1>Trabajos</h1><button class="btn" data-act="sort">${S.asc?"↑ Antiguos":"↓ Recientes"}</button><button class="btn" data-act="backup">Respaldo</button><button class="btn pri" data-act="new">+</button></header>
  ${memOnly?`<div class="card bad"><small>Este navegador no permite guardar datos: lo que ingreses se perderá al cerrar. Usa Respaldo.</small></div>`:""}
  <div class="card"><small>Por cobrar (líquido)</small><div style="font-size:26px;font-weight:700">${clp(tot)}</div>${od?`<span class="badge bad">${od} vencido${od>1?"s":""}</span>`:""}</div>
  <div class="seg">${seg}</div>
  ${list.length?list.map(j=>`<button class="card job" data-act="open" data-id="${j.id}"><i class="bar ${urg(j)}"></i><div class="grow"><b>${esc(j.name)}</b>${j.co?`<small>${esc(j.co)}</small>`:""}<small>${j.kind==="boleta"?"Boleta":"Jornada"} · ${fmt(j.prod)}</small><span class="badge ${urg(j)}">${label(j)}</span></div><div class="amt"><b>${clp(net(j))}</b><small>líquido</small></div></button>`).join(""):`<div class="empty">${jobs.length?"No hay trabajos en este filtro.":"Aún no hay trabajos. Toca + para registrar tu primera jornada."}</div>`}`;
}

const gcal=(t,s,d)=>{const e=parse(s);e.setDate(e.getDate()+1);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t)+"&dates="+s.replace(/-/g,"")+"/"+ymd(e).replace(/-/g,"")+"&details="+encodeURIComponent(d)};

function detail(){
  const j=jobs.find(x=>x.id===S.id);
  if(!j){S.view="home";return home()}
  const ex=(j.expenses||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const kv=(a,b,c)=>`<div class="kv ${c&&c.indexOf("b")===0?"b":""}"><span>${a}</span><span class="${c||""}">${b}</span></div>`;
  return `<header><button class="btn" data-act="back">‹ Volver</button><h1 style="font-size:18px;text-align:center">${esc(j.name)}</h1><button class="btn" data-act="edit">Editar</button></header>
  <div class="card">${j.co?`<div class="b">${esc(j.co)}</div>`:""}<small>${kindName(j)}</small><div><span class="badge ${urg(j)}">${label(j)}</span></div></div>
  <div class="card"><b>Resumen financiero</b>
    ${kv("Valor de la jornada",clp(j.net))}${j.ot>0?kv("Horas extras ("+j.ot+" h)","+ "+clp(otAmt(j))):""}${kv("Líquido a recibir",clp(net(j)),"b pos")}
    ${kv(j.kind==="boleta"?"+ Retención 15,25 %":"Retención (no aplica)",clp(ret(j)))}
    ${kv(j.kind==="boleta"?"Bruto a emitir en la boleta":"Monto del contrato",clp(gross(j)))}
    ${kv("Gastos asociados","− "+clp(exp(j)),"neg")}
    ${kv("Resultado tras gastos",clp(net(j)-exp(j)),"b")}</div>
  <div class="card"><b>Fechas</b>
    ${kv("Rodaje",fmt(j.prod))}
    ${j.kind==="boleta"?kv("Emisión de la BH",j.inv?fmt(j.inv):"No emitida")+kv("Plazo cuenta desde",j.inv&&j.base==="inv"?"Emisión de la BH":"Rodaje"):""}
    ${kv("Plazo límite (30 días)",fmt(dueStr(j)),"b")}
    ${j.paid&&j.paidDate?kv("Pagado el",fmt(j.paidDate),"pos"):""}</div>
  <div class="card"><b>Gastos y notas</b>
    ${ex.length?ex.map(e=>`<div class="kv"><span>${esc(e.concept)}<br><small>${fmt(e.date)}</small></span><span>${clp(e.amount)} <button class="btn dng" style="padding:2px 8px" data-act="delexp" data-eid="${e.id}">✕</button></span></div>`).join(""):`<div class="msg">Sin gastos registrados</div>`}
    <button class="btn full" data-act="expnew">+ Agregar gasto</button>
    ${j.notes?`<p class="msg">${esc(j.notes).replace(/\n/g,"<br>")}</p>`:""}</div>
  <button class="btn pri full" data-act="pay">${j.paid?"Marcar como pendiente":"Marcar como pagado"}</button>
  <a class="btn full" target="_blank" rel="noopener" href="${gcal("Cobro: "+j.name,dueStr(j),"Líquido a recibir: "+clp(net(j)))}">Agregar fecha límite al calendario</a>
  <a class="btn full" target="_blank" rel="noopener" href="${gcal("Jornada: "+j.name,j.prod,j.notes||"")}">Agregar jornada al calendario</a>
  <button class="btn dng full" data-act="del">${S.cd?"Toca de nuevo para eliminar":"Eliminar trabajo"}</button>`;
}

function formSheet(){
  const e=S.sheet.id?jobs.find(x=>x.id===S.sheet.id):null;
  const j=e||{name:"",kind:"boleta",prod:ymd(new Date()),inv:"",base:"prod",net:0,ot:0,notes:""};
  const sel=(a,b)=>a===b?" selected":"";
  return `<div class="ov"><div class="pan"><h2>${e?"Editar trabajo":"Nuevo trabajo"}</h2>
  <label>Proyecto o cliente</label><input id="f-name" value="${esc(j.name)}" placeholder="Ej. Spot publicitario">
  <label>Productora</label><input id="f-co" value="${esc(j.co)}" placeholder="Nombre de la productora">
  <label>Tipo de cobro</label><select id="f-kind"><option value="boleta"${sel(j.kind,"boleta")}>Boleta de Honorarios</option><option value="jornada"${sel(j.kind,"jornada")}>Contrato por Jornada</option></select>
  <label>Fecha de rodaje</label><input id="f-prod" type="date" value="${j.prod}">
  <div id="invbox"><div class="chk"><input id="f-has" type="checkbox"${j.inv?" checked":""}><span>Ya emití la boleta</span></div>
  <div id="invfields"><label>Fecha de emisión de la BH</label><input id="f-inv" type="date" value="${j.inv||ymd(new Date())}">
  <label>Contar los 30 días</label><select id="f-base"><option value="prod"${sel(j.base,"prod")}>Desde el rodaje</option><option value="inv"${sel(j.base,"inv")}>Desde la emisión de la BH</option></select></div></div>
  <label>Valor de la jornada (líquido)</label><input id="f-gross" inputmode="numeric" placeholder="0" value="${j.net?dots(j.net):""}">
  <label>Horas extras (cada hora = 15 % del valor de la jornada)</label><input id="f-ot" inputmode="decimal" placeholder="0" value="${j.ot||""}">
  <div class="card" id="bd"></div>
  <label>Notas</label><textarea id="f-notes" rows="3">${esc(j.notes)}</textarea>
  <button class="btn pri full" id="f-save" data-act="saveform">Guardar</button><button class="btn full" data-act="close">Cancelar</button></div></div>`;
}
function formVals(){
  const g=id=>$("#"+id),kind=g("f-kind").value,has=g("f-has").checked;
  return {name:g("f-name").value.trim(),co:g("f-co").value.trim(),kind:kind,prod:g("f-prod").value,inv:kind==="boleta"&&has?g("f-inv").value:"",base:g("f-base").value,net:money(g("f-gross").value),ot:Math.max(0,parseFloat(String(g("f-ot").value).replace(",","."))||0),notes:g("f-notes").value};
}
function sync(){
  const v=formVals(),r=ret(v);
  $("#invbox").style.display=v.kind==="boleta"?"block":"none";
  $("#invfields").style.display=$("#f-has").checked?"block":"none";
  $("#bd").innerHTML=`<div class="kv"><span>Valor de la jornada</span><span>${clp(v.net)}</span></div>${v.ot>0?`<div class="kv"><span>Horas extras (${v.ot} h)</span><span>+ ${clp(otAmt(v))}</span></div>`:""}<div class="kv b"><span>Líquido que recibes</span><span class="pos">${clp(net(v))}</span></div><div class="kv"><span>${v.kind==="boleta"?"+ Retención 15,25 %":"Retención (no aplica)"}</span><span>${clp(r)}</span></div><div class="kv b"><span>${v.kind==="boleta"?"Bruto a emitir en la boleta":"Monto del contrato"}</span><span>${clp(gross(v))}</span></div><div class="kv"><span>Plazo límite de pago</span><span>${v.prod?fmt(dueStr(v)):"—"}</span></div>`;
  $("#f-save").disabled=!(v.name&&v.net>0&&v.prod);
}
const expSheet=()=>`<div class="ov"><div class="pan"><h2>Nuevo gasto</h2>
  <label>Descripción</label><input id="x-con" placeholder="Combustible, comida, estacionamiento…">
  <label>Monto</label><input id="x-amt" inputmode="numeric" placeholder="0">
  <button class="btn pri full" id="x-save" data-act="saveexp" disabled>Agregar</button><button class="btn full" data-act="close">Cancelar</button></div></div>`;
const bkSheet=()=>`<div class="ov"><div class="pan"><h2>Respaldo y ayuda</h2>
  <p class="msg">Tus datos viven en este navegador. Copia un respaldo de vez en cuando y guárdalo en tus notas.</p>
  <textarea id="bk" rows="5" placeholder="Pega aquí un respaldo para restaurarlo"></textarea>
  <button class="btn pri full" data-act="genbk">Generar y copiar respaldo</button>
  <button class="btn full" data-act="restore">Reemplazar mis datos con el texto de arriba</button>
  <div class="msg" id="bkmsg"></div>
  <p class="msg">Para instalar: en iPhone, Compartir › Agregar a inicio. En Android, menú ⋮ › Instalar app. Los avisos de vencimiento se ven dentro de la app (naranja: faltan 7 días o menos; rojo: vencido).</p>
  <button class="btn full" data-act="close">Cerrar</button></div></div>`;

function render(){
  $("#app").innerHTML=S.view==="detail"?detail():home();
  const t=S.sheet&&S.sheet.type;
  $("#sheet").innerHTML=t==="form"?formSheet():t==="exp"?expSheet():t==="bk"?bkSheet():"";
  if(t==="form")sync();
}

document.addEventListener("click",e=>{
  const o=e.target.closest(".ov");
  if(o&&e.target===o){S.sheet=null;return render()}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,j=jobs.find(x=>x.id===S.id);
  if(a==="genbk"){const t=$("#bk"),m=$("#bkmsg"),s=JSON.stringify(jobs);t.value=s;t.select();
    try{navigator.clipboard.writeText(s).then(()=>m.textContent="Respaldo copiado al portapapeles.",()=>m.textContent="Selecciona el texto y cópialo.")}catch(x){m.textContent="Selecciona el texto y cópialo."}return}
  if(a==="restore"){try{const arr=JSON.parse($("#bk").value);if(!Array.isArray(arr))throw 0;
    jobs=arr.filter(x=>x&&x.id&&x.name).map(x=>mig(Object.assign({expenses:[]},x)));save();S.view="home";$("#app").innerHTML=home();$("#bkmsg").textContent="Se restauraron "+jobs.length+" trabajos."}
    catch(x){$("#bkmsg").textContent="El texto no es un respaldo válido."}return}
  if(a==="open"){S.view="detail";S.id=b.dataset.id;S.cd=false;window.scrollTo(0,0)}
  else if(a==="back")S.view="home";
  else if(a==="new")S.sheet={type:"form"};
  else if(a==="edit")S.sheet={type:"form",id:S.id};
  else if(a==="close")S.sheet=null;
  else if(a==="filter")S.filter=b.dataset.v;
  else if(a==="sort")S.asc=!S.asc;
  else if(a==="backup")S.sheet={type:"bk"};
  else if(a==="expnew")S.sheet={type:"exp"};
  else if(a==="saveform"){const v=formVals();if(!(v.name&&v.net>0&&v.prod))return;if(!v.inv)v.base="prod";
    if(S.sheet.id)Object.assign(jobs.find(x=>x.id===S.sheet.id),v);else jobs.push(Object.assign({id:uid(),paid:false,paidDate:null,expenses:[]},v));
    save();S.sheet=null}
  else if(a==="saveexp"){const c=$("#x-con").value.trim(),n=money($("#x-amt").value);if(!c||!n||!j)return;
    j.expenses=j.expenses||[];j.expenses.push({id:uid(),concept:c,amount:n,date:ymd(new Date())});save();S.sheet=null}
  else if(a==="delexp"&&j){j.expenses=j.expenses.filter(x=>x.id!==b.dataset.eid);save()}
  else if(a==="pay"&&j){j.paid=!j.paid;j.paidDate=j.paid?ymd(new Date()):null;save()}
  else if(a==="del"&&j){if(!S.cd)S.cd=true;else{jobs=jobs.filter(x=>x.id!==j.id);save();S.view="home";S.cd=false}}
  render();
});
function onInput(e){
  if(e.target.id==="f-gross"||e.target.id==="x-amt")e.target.value=dots(e.target.value);
  const t=S.sheet&&S.sheet.type;
  if(t==="form")sync();
  if(t==="exp")$("#x-save").disabled=!($("#x-con").value.trim()&&money($("#x-amt").value)>0);
}
document.addEventListener("input",onInput);
document.addEventListener("change",onInput);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!S.sheet)render()});

try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");x.fillStyle="#2563eb";x.fillRect(0,0,180,180);x.font="100px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("💸",90,96);$("#icon").href=c.toDataURL("image/png")}catch(e){}
render();
</script>
</body>
</html>
